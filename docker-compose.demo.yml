# Athorize — DEMO instance: pre-loaded with fake data, log in as admin / admin.
#
#   docker compose -f docker-compose.demo.yml up -d
#   open http://localhost:8002
#
# WARNING: every demo account uses its username as its password (admin/admin,
# manager/manager, ...). It is published on 127.0.0.1 only. Never put real data
# in it and never expose it to a network. For a real install use
# docker-compose.yml instead (blank instance + Setup screen).
#
# It is a separate compose project with its own volume, so it never touches a
# "keep it" install. Reset it with: docker compose -f docker-compose.demo.yml down -v
name: athorize-demo

services:
  athorize:
    image: ${ATHORIZE_IMAGE:-athorize:local}
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ATHORIZE_DEMO_PORT:-8002}:8001"
    volumes:
      - athorize-demo-data:/data
    environment:
      ATHORIZE_DEMO_SEED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  athorize-demo-data:
