name: docker

# Builds the single-container image on every push / PR, smoke-tests it
# (health, demo login, frameworks API, SPA serving, non-root), and on a
# version tag (v*) publishes a multi-arch image to GHCR.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: athorize:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (demo seed)
        run: |
          set -euo pipefail
          docker run -d --name athorize-ci -p 127.0.0.1:8001:8001 \
            -e ATHORIZE_DEMO_SEED=1 athorize:ci
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8001/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8001/api/health | tee /dev/stderr | grep -q '"ok"'

          # Runs as a non-root user
          test "$(docker exec athorize-ci id -u)" != "0"

          # Demo login (admin/admin) + authenticated API call
          code=$(curl -s -o /tmp/login.json -w '%{http_code}' -c /tmp/jar \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin"}' \
            http://127.0.0.1:8001/api/auth/login)
          cat /tmp/login.json; echo
          test "$code" = "200"
          curl -sf -b /tmp/jar http://127.0.0.1:8001/api/frameworks -o /tmp/fw.json
          python3 -c "import json; d=json.load(open('/tmp/fw.json')); n=len(d if isinstance(d,list) else d.get('frameworks',d)); print('frameworks:', n); assert n > 0"

          # Web UI served from the same process, incl. SPA deep links
          curl -sf http://127.0.0.1:8001/ | grep -qi '<div id="root"'
          curl -sf http://127.0.0.1:8001/controls | grep -qi '<div id="root"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/api/does-not-exist)" = "404"

          # Docker health status turns healthy
          for _ in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' athorize-ci)
            [ "$s" = "healthy" ] && break
            sleep 5
          done
          echo "health: $s"; test "$s" = "healthy"

      - name: Smoke test (blank instance prints setup token)
        run: |
          set -euo pipefail
          docker run -d --name athorize-blank athorize:ci
          for _ in $(seq 1 30); do
            docker logs athorize-blank 2>&1 | grep -q "SETUP TOKEN:" && break
            sleep 2
          done
          docker logs athorize-blank 2>&1 | grep "SETUP TOKEN:"

      - name: Container logs
        if: always()
        run: |
          docker logs athorize-ci 2>&1 | tail -100 || true
          docker logs athorize-blank 2>&1 | tail -50 || true
          docker rm -f -v athorize-ci athorize-blank || true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lower-case image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
