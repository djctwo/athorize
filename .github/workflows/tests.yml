name: tests

# The test suites on every push to main and every pull request:
#   backend   pytest on the FLOOR versions of backend/requirements.txt (every
#             ">=x" pinned to "==x", oldest supported Python) and on the NEWEST
#             versions in range (newest Python) — the ranges are only honest if
#             both ends pass;
#   frontend  type check + unit tests;
#   e2e       the Playwright journeys (demo and blank instances) against a real
#             single-process server; the HTML report is uploaded when they fail.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.deps }} deps, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - deps: floor
            python: "3.11"
          - deps: newest
            python: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies (${{ matrix.deps }})
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = floor ]; then
            # ">=x[,<y]" -> "==x": the oldest versions the ranges allow.
            sed -E 's/^([][A-Za-z0-9_.-]+)>=([^,;[:space:]]+).*$/\1==\2/' requirements.txt > "$RUNNER_TEMP/floor.txt"
            cat "$RUNNER_TEMP/floor.txt"
            python -m pip install -r "$RUNNER_TEMP/floor.txt" pytest
          else
            python -m pip install --upgrade -r requirements.txt pytest
          fi
          python -m pip list

      - name: pytest
        working-directory: backend
        run: python -m pytest -q -p no:cacheprovider

      - name: Integration-watch unit tests
        run: python -m unittest discover -s scripts/tests -t .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npx vitest run

  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project: [demo, blank]
    env:
      E2E_BASE_URL: http://127.0.0.1:8042
      E2E_DATA_DIR: ${{ github.workspace }}/../e2e-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Build the UI + install the browser
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium

      - name: Start a throw-away ${{ matrix.project }} instance
        run: |
          PY=python bash frontend/e2e/serve.sh "${{ matrix.project }}" "$E2E_DATA_DIR" 8042 > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 90); do
            curl -sf "$E2E_BASE_URL/api/health" >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"; exit 1

      - name: Playwright (${{ matrix.project }})
        working-directory: frontend
        run: |
          if [ "${{ matrix.project }}" = demo ]; then npm run test:e2e; else npm run test:e2e:blank; fi

      - name: Server log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/server.log"

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
