name: release-tooling

# Validates package_release.sh + update.sh on a real Linux runner (no local
# Linux box needed). Builds a release, applies it to a simulated install, and
# asserts the swap, data preservation, and rollback snapshot all work.

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "frontend/**"
      - "desktop/launcher.py"
      - "backend/services/demo_seed.py"
      - "docs/INSTALL.md"
      - "backend/config.py"
      - "backend/tests/test_release_tooling.py"
      - "backend/tests/test_ops_scripts.py"
      - ".github/workflows/release-tooling.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "frontend/**"
      - "desktop/launcher.py"
      - "backend/services/demo_seed.py"
      - "docs/INSTALL.md"
      - "backend/config.py"
      - "backend/tests/test_release_tooling.py"
      - "backend/tests/test_ops_scripts.py"
      - ".github/workflows/release-tooling.yml"
  workflow_dispatch:

jobs:
  release-update-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Script-level tests (update.sh, run-eval.sh, reset-demo.sh, INSTALL.md nginx example)
        run: |
          pip install -r backend/requirements.txt pytest
          cd backend && python -m pytest -q tests/test_release_tooling.py tests/test_ops_scripts.py

      - name: Build a release tarball
        run: bash scripts/package_release.sh "ci-${GITHUB_SHA::7}"

      - name: The tarball carries the licence, notices, README and docs
        run: |
          set -euo pipefail
          set -- dist/athorize-*.tar.gz; TARBALL="$1"
          LIST="$(tar -tzf "$TARBALL")"
          for f in LICENSE NOTICE README.md VERSION docs/INSTALL.md frontend/dist/index.html backend/main.py backend/services/demo_seed.py; do
            echo "$LIST" | grep -qx "athorize-ci-${GITHUB_SHA::7}/$f" || { echo "missing from release: $f" >&2; exit 1; }
          done
          if echo "$LIST" | grep -q '/backend/\.env$'; then echo "backend/.env must never ship" >&2; exit 1; fi
          if echo "$LIST" | grep -q '/\._'; then echo "AppleDouble ._ files in the release" >&2; exit 1; fi

      - name: Apply it to a simulated install and verify
        run: |
          set -euo pipefail
          set -- dist/athorize-*.tar.gz; TARBALL="$1"
          INSTALL="$RUNNER_TEMP/athorize-universal"
          DATA="$RUNNER_TEMP/var-lib-athorize"          # DATA_DIR lives outside the install (INSTALL §3)
          mkdir -p "$INSTALL/backend" "$INSTALL/frontend/dist" "$DATA"
          echo "0.0.0-old" > "$INSTALL/VERSION"
          echo "PRECIOUS" > "$DATA/data.db"
          echo "stale"    > "$INSTALL/frontend/dist/old.js"
          # The install's configuration and the venv its service runs (INSTALL §4-§6).
          printf 'DATA_DIR=/var/lib/x\nATHORIZE_ALLOWED_HOSTS=compliance.internal.example.com\n' > "$INSTALL/backend/.env"
          chmod 600 "$INSTALL/backend/.env"
          cp "$INSTALL/backend/.env" "$RUNNER_TEMP/env.before"
          python3 -m venv "$INSTALL/.venv"

          # --skip-service: the runner has systemctl but no athorize unit.
          sudo bash scripts/update.sh --release "$TARBALL" --install-dir "$INSTALL" --skip-service

          echo "== assertions =="
          test "$(cat "$INSTALL/VERSION")" = "ci-${GITHUB_SHA::7}"       # version bumped
          test "$(cat "$DATA/data.db")" = "PRECIOUS"                    # data untouched
          test -f "$INSTALL/backend/main.py"                            # new code swapped in
          test -f "$INSTALL/frontend/dist/index.html"                  # new dist swapped in
          test ! -f "$INSTALL/frontend/dist/old.js"                    # stale dist purged
          ls -d "${INSTALL}".bak-* >/dev/null                          # rollback snapshot kept
          sudo cmp "$INSTALL/backend/.env" "$RUNNER_TEMP/env.before"   # configuration kept (R2INSTALL-1)
          test "$(sudo stat -c %U:%a "$INSTALL/backend/.env")" = root:600  # no service user here: mode kept, root-owned
          "$INSTALL/.venv/bin/python" -c "import fastapi, uvicorn"      # the service's venv got the deps (R2INSTALL-3)
          test ! -d "$INSTALL/backend/.venv"
          ls -d "${INSTALL}".bak-*/.venv >/dev/null                    # previous venv kept for rollback
          # Least privilege: code + venv belong to root (the service only reads them).
          test "$(stat -c %U "$INSTALL")" = root
          test "$(stat -c %U "$INSTALL/backend/main.py")" = root
          test "$(stat -c %U "$INSTALL/.venv/pyvenv.cfg")" = root
          echo "release-tooling round-trip: OK"

      - name: Checksum integrity is verified by update.sh
        run: |
          set -euo pipefail
          set -- dist/athorize-*.tar.gz; TARBALL="$1"
          # Corrupt the tarball; update.sh must refuse it via the .sha256 sidecar.
          printf 'x' >> "$TARBALL"
          INSTALL="$RUNNER_TEMP/athorize-corrupt"
          mkdir -p "$INSTALL"; echo "0" > "$INSTALL/VERSION"
          if sudo bash scripts/update.sh --release "$TARBALL" --install-dir "$INSTALL" --skip-service; then
            echo "ERROR: corrupted tarball was accepted" >&2; exit 1
          fi
          echo "checksum-rejection: OK"
