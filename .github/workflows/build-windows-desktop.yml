name: build-windows-desktop

# Produces a double-clickable Windows .exe of Athorize (frozen single-process
# serve) so a user runs ONE file — no WSL, no Python, no pip, no nginx. The
# Windows .exe ships labelled BETA (Docker + Linux are the primary installs).
#
# Every run:
#   build  builds the .exe(s) and SMOKE-TESTS each one (start, /api/health, UI
#          served, demo login / blank Setup screen), then uploads them;
#   e2e    starts each BUILT .exe on the Windows runner (the exe is the server —
#          not uvicorn from source) and runs the real Playwright journeys against
#          it: Athorize-Demo.exe -> the `demo` project, Athorize.exe -> `blank`.
#          This replaces a human click-through on a Windows machine.
# Download the result from the run's Artifacts. The server install is
# documented in docs/INSTALL.md.
#
# Triggers: on demand (Actions tab -> Run workflow), version tags, weekly, and
# pushes to main that change what goes INTO the exe or the suite that proves it
# (backend/, frontend/, desktop/, frameworks/, this file). Docs-only and
# backend-unit-test-only pushes skip it: they cannot change the exe and the
# Linux `tests` workflow covers them. A newer push to main cancels an older,
# still-running Windows run (tags never cancel).
#
# Variants:
#   demo   auto-seeds demo data, log in admin/admin.
#   blank  blank instance (Setup screen on first run: set up a company or explore demo data).

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "backend/**"
      - "!backend/tests/**"
      - "frontend/**"
      - "desktop/**"
      - "frameworks/**"
      - ".github/workflows/build-windows-desktop.yml"
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday 04:17 UTC
  workflow_dispatch:
    inputs:
      variant:
        description: "Which build(s) to produce (each one is smoke-tested and e2e-tested)"
        type: choice
        default: both
        options: [demo, blank, both]

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    # On a push/schedule trigger there are no inputs — default to building both variants.
    env:
      VARIANT: ${{ inputs.variant || 'both' }}
    outputs:
      # The e2e matrix: one Playwright project per exe this run built.
      projects: ${{ steps.projects.outputs.projects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the web UI (frontend/dist is gitignored — must be rebuilt)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install backend deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Build demo .exe
        if: ${{ env.VARIANT == 'demo' || env.VARIANT == 'both' }}
        env:
          ATHORIZE_BUILD: demo
        run: pyinstaller desktop/athorize.spec --distpath desktop/dist --workpath desktop/build --noconfirm

      - name: Build blank .exe
        if: ${{ env.VARIANT == 'blank' || env.VARIANT == 'both' }}
        env:
          ATHORIZE_BUILD: blank
        run: pyinstaller desktop/athorize.spec --distpath desktop/dist --workpath desktop/build --noconfirm

      - name: Smoke-test the demo .exe (start, health, UI, login, frameworks)
        if: ${{ env.VARIANT == 'demo' || env.VARIANT == 'both' }}
        shell: pwsh
        run: ./desktop/windows/smoke-test.ps1 -Exe desktop/dist/Athorize-Demo.exe -Port 8013 -Demo

      - name: Smoke-test the blank .exe (start, health, UI, setup screen, demo-data choice)
        if: ${{ env.VARIANT == 'blank' || env.VARIANT == 'both' }}
        shell: pwsh
        run: ./desktop/windows/smoke-test.ps1 -Exe desktop/dist/Athorize.exe -Port 8014

      - name: Include the end-user Read Me alongside the .exe
        shell: bash
        run: cp "desktop/windows/READ ME FIRST.txt" desktop/dist/

      - name: Upload Windows executable(s)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: athorize-windows-${{ env.VARIANT }}
          path: |
            desktop/dist/*.exe
            desktop/dist/READ ME FIRST.txt
          if-no-files-found: error

      - name: Which e2e projects to run
        id: projects
        shell: bash
        run: |
          case "$VARIANT" in
            demo)  echo 'projects=["demo"]' >> "$GITHUB_OUTPUT" ;;
            blank) echo 'projects=["blank"]' >> "$GITHUB_OUTPUT" ;;
            *)     echo 'projects=["demo","blank"]' >> "$GITHUB_OUTPUT" ;;
          esac

  e2e:
    name: e2e on the built exe (${{ matrix.project }})
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.build.outputs.projects) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the exe(s) this run built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: athorize-windows-${{ inputs.variant || 'both' }}
          path: desktop/dist

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the e2e suite + Chromium
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - name: Playwright ${{ matrix.project }} project against the built exe
        shell: pwsh
        run: |
          $exe = if ('${{ matrix.project }}' -eq 'demo') { 'desktop/dist/Athorize-Demo.exe' } else { 'desktop/dist/Athorize.exe' }
          ./desktop/windows/run-e2e.ps1 -Exe $exe -Project '${{ matrix.project }}' -Port 8042 `
            -DataDir "$env:RUNNER_TEMP\e2e-data-${{ matrix.project }}" -LogDir "$env:RUNNER_TEMP\exe-logs"

      - name: Upload the Playwright report + exe console logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-e2e-${{ matrix.project }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            ${{ runner.temp }}/exe-logs/
          retention-days: 14
